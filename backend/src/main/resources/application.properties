spring.application.name=springboot-app-morascore
# Datasource
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/morascore}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}
# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
# Deshabilitar open-in-view para no mantener la sesión DB abierta durante la serialización JSON
spring.jpa.open-in-view=false
# HikariCP - Connection pool
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
# Server
server.port=8080
# FastAPI - URL del endpoint de predicción del modelo ML
ml.service.url=${ML_SERVICE_URL:http://localhost:8000/predict}
# JWT
application.security.jwt.secret-key=${JWT_SECRET_KEY:}
application.security.jwt.expiration=86400000
application.security.jwt.refresh-token.expiration=604800000
# swagger-ui custom path
springdoc.swagger-ui.path=/swagger-ui.html

# Codespaces / Reverse Proxy support
server.forward-headers-strategy=framework

